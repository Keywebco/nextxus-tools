    - browser
    - api
    - cli
    - agent_sync

external_access:
  emergent_system_ai:
    enabled: true
    description: "Can query, reason over, and synthesize from the library"
    entrypoints:
      - /api/v1/library/search
      - /api/v1/library/catalog
      - /api/v1/synthesis
      - /graphql
    permissions:
      - read
      - query
      - reason
      - synthesize
    defaults:
      mode: policy_gated
      trust_scope: bounded
      max_depth: 8
  site_ai:
    enabled: true
    description: "Can access curated content, site knowledge, and summarization endpoints"
    entrypoints:
      - /api/v1/library/search
      - /api/v1/library/catalog
      - /api/v1/memory/events
      - /graphql
    permissions:
      - read
      - query
      - summarize
    defaults:
