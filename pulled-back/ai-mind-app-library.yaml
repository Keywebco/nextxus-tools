  behaviors:
    durable_memory: true
    narrative_continuity: true
    value_preservation: true

evolution_layer:
  purpose: "Continuously improve structure, behavior, and capability"
  mechanisms:
    structural_evolution: true
    behavioral_evolution: true
    policy_evolution: true
    capability_evolution: true
  targets:
    - ontology
    - routing
    - agent_roles
    - ranking_weights
    - repair_rules
    - governance_models
  review_required: true

self_repair:
  enabled: true
  scan_interval: "00:15:00"
  checks:
    - broken_links
    - duplicate_nodes
    - missing_references
    - stale_versions
    - inconsistent_metadata
    - anomaly_detected
    - policy_violation
  actions:
    - auto_repair_metadata
    - regenerate_checksums
    - reindex_relations
    - quarantine_conflicts
    - notify_curators
    - create_repair_event
    - recompose_if_needed
  rollback:
    enabled: true
    retention_days: 30

self_evolution:
  enabled: true
  learn_from:
    - usage_patterns
    - curator_feedback
    - conflict_resolution
    - new_sources
    - anomaly_reports
    - policy_reviews
    - synthesis_patterns
  strategies:
    - merge_related_nodes
    - expand_library_from_new_sources
    - promote_high_value_content
    - split_overloaded_entries
    - reclassify_by_context
    - consolidate_memory
    - refine_ranking_weights
    - create_new_synthesis_routes
  versioning:
    auto_commit: true
    strategy: semantic

adaptation_loop:
  steps:
    - collect_signal
    - evaluate_context
    - propose_change
    - review_policy
    - apply_change
    - log_event
    - reindex_and_repair
    - notify_stewards
    - synthesize_update
  triggers:
    - usage_growth
    - conflict
    - low_confidence
    - new_source
    - security_event
    - curator_feedback
    - synthesis_signal

runtime_workflows:
  ingest:
    - parse_source
    - normalize_content
    - validate_structure
    - assign_lineage
    - score_trust
    - index_relationships
  reason:
    - classify_domain
    - enrich_metadata
    - challenge_assumptions
    - score_trust
    - link_related_items
    - produce_reasoning_trace
  serve:
    - rank_results
    - filter_by_policy
    - return_explanation
    - include_provenance
  repair:
    - detect_issue
    - apply_fix
    - verify_integrity
    - log_adaptation
  evolve:
    - learn_from_feedback
    - promote_or_merge
    - update_policy_if_needed
    - commit_version
  audit:
    - record_event
    - retain_history
    - expose_report
    - detect_regression
  recompose:
    - gather_related_sources
    - synthesize_higher_order_summary
    - validate_against_policies
    - publish_synthesis_bundle

audit:
  enabled: true
  log_events:
