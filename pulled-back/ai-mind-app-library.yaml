      enabled: true
      formats: [yaml, json, markdown, txt, csv]
    git:
      enabled: true
      sync: true
    web:
      enabled: true
      sources: [rss, api, docs]
    vector_store:
      enabled: false
    llm_provider:
      enabled: false
    notebook:
      enabled: true
      format: ipynb
  sync_rules:
    - "External content must be normalized before ingestion"
    - "Imported content must receive trust and lineage metadata"
    - "External changes must create review tasks if they affect core policy"

intelligence_mesh:
  purpose: "Coordinate cognition, memory, reasoning, and synthesis as a collective intelligence fabric"
  components:
    coordinator:
      enabled: true
      role: orchestrate_agents_and_workflows
    signal_router:
      enabled: true
      role: route_tasks_to_best_agents
    synthesis_pool:
      enabled: true
      role: compose_fragments_into_higher_order_artifacts
    conflict_mesh:
